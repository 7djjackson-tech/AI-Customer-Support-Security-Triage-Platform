{% extends 'base.html' %}{% block content %}<h1>Staff access</h1><p>Roles are checked on every request. Changes take effect immediately.</p><section class="message"><h2>Create staff account</h2><form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="operation" value="create"><label>Username <input name="username" maxlength="80" required autocomplete="off"></label><label>Password (12+ characters) <input name="password" type="password" minlength="12" maxlength="1024" required autocomplete="new-password"></label><label>Role <select name="role"><option value="customer_service">Customer service</option><option value="security">Security</option><option value="admin">Administrator</option></select></label><button>Create account</button></form></section><section class="message"><h2>Manage roles</h2>{% for user in staff %}<form method="post" class="role-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="staff_id" value="{{ user.id }}"><strong>{{ user.username }}</strong><label>Role <select name="role">{% for role in ['customer_service','security','admin'] %}<option value="{{ role }}" {% if role==user.role %}selected{% endif %}>{{ role }}</option>{% endfor %}</select></label><button>Save role</button></form>{% endfor %}</section>{% endblock %}
